<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />


    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: 'open sans', sans-serif;
        }
        
        .navbar{
            height: 70px;
            border: 2px solid black;
            display: flex;
            justify-content: space-around;
        }

        #logo{
            width: 8%;
            /* border: 2px solid purple; */
            display: flex;
            justify-content: center;
        }

        .img{
            height: 90%;
            width: 120%;
            /* border: 2px solid paleturquoise; */
           
            
        }

        #nav{
            display: flex;
            width: 34%;
            justify-content: space-between;
            /* border: 2px solid peru; */
            align-items: center;
            
        }
        #searchcontainer{
            width: 34%;
            /* border: 2px solid palevioletred; */
            display: flex;
            align-items: center;

        }
        .search{
            height: 40px;
            width: 100%;
            /* background-color: #f5f5f6; */
            border-radius: 5px;
            display: flex;
            align-items: center;
        }
        .search span{
            margin: 15px;
        }
    
        .search input{
            border: none;
            /* background-color: #f5f5f6; */
            outline: none;
            width: 100%;
        }


        #profile{
            width: 14%;
            /* border: 2px solid blue; */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #profile div{
            width: 30%;
            /* border: 1px solid red; */
            text-align: center;
            
        }
        #profile div p{
            font-size: 12px;
        }

        #input{
            width: 80%;
            
        }

        .body{
            border: 2px solid blue;
            height: 1000px;
        }

        .footer{
            border: 2px solid brown;
            height: 100px;
        }
        .corsorpointer{
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="container">

    <div class="navbar">
        <div id="logo">
            <img class="img corsorpointer" src="https://www.freepnglogos.com/uploads/logo-myntra-png/myntra-logo-m-png-3.png" alt="img">
        </div>
        <div id="nav">
            <h5 class="corsorpointer">MEN</h5>
            <h5 class="corsorpointer">WOMEN</h5>
            <h5 class="corsorpointer">KIDS</h5>
            <h5 class="corsorpointer">HOME</h5>
            <h5 class="corsorpointer">BEAUTY</h5>
            <h5 class="corsorpointer">GENZ</h5>
            <h5 class="corsorpointer">STUDIO</h5>
        </div>
        <div id="searchcontainer">
            <div class="search">
                <span class="material-symbols-outlined">
search
</span>
                <input type="text" placeholder="Search for products, brands and more">
            </div>
    
        </div>
            
        <div id="profile">
            <div><img src="/dnyanesh.png" alt="">
                <p>Profile</p>
            </div>
            <div><img src="/dnyaneh1.png" alt="">
                <p>Wishlist</p>
            </div>
            <div><img src="/dnyanesh2.png" alt="">
                <p>Bag</p>
            </div>
        </div>


    </div>
    <div class="body">Body</div>
    <div class="footer">Footer</div>

    </div>


    
</body>
</html>
